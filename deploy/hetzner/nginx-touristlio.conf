# Touristlio — Nginx reverse proxy
# Kurulum:
#   sudo cp deploy/hetzner/nginx-touristlio.conf /etc/nginx/sites-available/touristlio
#   sudo ln -sf /etc/nginx/sites-available/touristlio /etc/nginx/sites-enabled/touristlio
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d touristlio.com -d www.touristlio.com

upstream touristlio_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name touristlio.com www.touristlio.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://touristlio_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }
}
