<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Profilim — Touristlio</title>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<nav class="tl-nav"><div class="nav-inner">
  <a href="/" class="brand"><img src="/images/logo-round.png" alt="" class="brand-mark brand-mark-round" width="44" height="44"/><span class="brand-text">Tourist<span class="brand-accent">lio</span></span></a>
  <div class="nav-r"><a href="/" class="btn nav-btn-ghost" style="text-decoration:none" data-i18n="explore">Keşfet</a>
  <button class="btn nav-btn-ghost" id="logoutBtn" onclick="doLogout()" data-i18n="logout">Çıkış</button></div>
</div></nav>
<div class="profile-wrap" id="profileRoot">
  <div id="pLoginNotice" style="text-align:center;padding:80px 20px">
    <div style="font-size:3rem;margin-bottom:12px">🔒</div>
    <div style="font-family:var(--fd);font-size:1.3rem;font-weight:700;color:var(--navy);margin-bottom:7px" data-i18n="profileLoginTitle">Giriş Yapın</div>
    <a href="/login" class="btn bp" data-i18n="profileLoginBtn">Giriş Yap / Kayıt Ol</a>
  </div>
  <div id="pContent" style="display:none">
    <div class="prof-hd">
      <div class="prof-av" id="profAv">?</div>
      <div><div class="prof-name" id="profName">—</div>
      <div class="prof-stats"><div class="psi"><span class="psi-n" id="pSavedCnt">0</span> <span data-i18n="profileStatSaved">Kaydedilen</span></div></div></div>
    </div>
    <h3 style="font-family:var(--fd);color:var(--navy)" data-i18n="profileTabSaved">❤️ Kaydedilenler</h3>
    <div class="pgrid" id="savedGrid"></div>
    <div class="empty-state" id="savedEmpty"><div class="empty-icon">❤️</div><p data-i18n-html="emptySaved">Henüz yer kaydetmediniz.</p></div>
  </div>
</div>
<script src="/js/i18n.js"></script>
<script>
const lang = localStorage.getItem('tl_lang') || 'tr';
window.TL_I18N.apply(lang);
async function api(path){
  const token = localStorage.getItem('tl_token');
  const res = await fetch('/api'+path, { credentials:'include', headers: token ? {Authorization:'Bearer '+token} : {} });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error);
  return data;
}
async function init(){
  try {
    const me = await api('/auth/me');
    document.getElementById('pLoginNotice').style.display='none';
    document.getElementById('pContent').style.display='block';
    document.getElementById('profName').textContent = me.user.name;
    document.getElementById('profAv').textContent = me.user.name[0];
    const saved = await api('/places/saved/all');
    document.getElementById('pSavedCnt').textContent = saved.places.length;
    const sg = document.getElementById('savedGrid');
    const se = document.getElementById('savedEmpty');
    if(!saved.places.length){ sg.innerHTML=''; se.style.display='block'; }
    else {
      se.style.display='none';
      sg.innerHTML = saved.places.map(p=>`<div class="pc" onclick="location.href='/?place=${p.id}'"><div class="pc-img"><img src="${p.imageUrl}" alt=""/></div><div class="pc-body"><div class="pc-name">${p.name}</div></div></div>`).join('');
    }
  } catch { /* login notice shown */ }
}
async function doLogout(){
  await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
  localStorage.removeItem('tl_token'); localStorage.removeItem('tl_user');
  location.href='/login';
}
init();
</script>
</body>
</html>
