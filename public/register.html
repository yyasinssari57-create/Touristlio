<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kayıt — Touristlio</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__"/>
<link rel="stylesheet" href="/css/inline-overrides.css?v=__APP_VERSION__"/>
</head>
<body class="auth-page">
<a href="#main-content" class="skip-link" data-i18n="skipLink">İçeriğe geç</a>
<nav class="tl-nav"><div class="nav-inner">
  <a href="/" class="brand"><span class="brand-text">Tourist<span class="brand-accent">lio</span></span></a>
  <a href="/" class="nav-brand-center" data-i18n-aria="logoHomeAlt" aria-label="Touristlio ana sayfaya git"><img src="/images/logo-round.webp?v=6" alt="Touristlio ana sayfaya git" class="brand-mark" data-i18n-alt="logoHomeAlt" width="46" height="46" loading="lazy" decoding="async" /></a>
</div></nav>
<div class="auth-page-box" id="main-content" tabindex="-1">
  <h1 data-i18n="authTabReg">Kayıt Ol</h1>
  <p class="auth-page-sub" data-i18n="authSub">Seyahatini yıldızla, kaydet ve paylaş</p>
  <label class="sr-only" for="regName" data-i18n="authName">Ad Soyad</label>
  <input class="ain" id="regName" type="text" data-i18n-placeholder="authName" placeholder="Ad Soyad" autocomplete="name"/>
  <label class="sr-only" for="regEmail" data-i18n="authEmail">E-posta</label>
  <input class="ain" id="regEmail" type="email" data-i18n-placeholder="authEmail" placeholder="E-posta" autocomplete="email"/>
  <label class="sr-only" for="regPass" data-i18n="authPassMin">Şifre (min 12 karakter)</label>
  <input class="ain" id="regPass" type="password" data-i18n-placeholder="authPassMin" placeholder="Şifre (min 12 karakter)" autocomplete="new-password"/>
  <div class="tl-hp" aria-hidden="true">
    <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"/></label>
  </div>
  <label class="kvkk-check"><input type="checkbox" id="gC"/> <span><a href="/legal/kvkk.html" target="_blank" rel="noopener" data-i18n="legalKvkk">KVKK</a> · <a href="/legal/terms.html" target="_blank" rel="noopener" data-i18n="termsShort">Kullanım Şartları</a> — <span data-i18n="authAccept">kabul ediyorum</span></span></label>
  <p id="authFormError" class="auth-inline-error" hidden></p>
  <button class="btn bp" id="regSubmit" type="button" data-act="doReg" data-i18n="authCreate">Hesap Oluştur</button>
  <p class="auth-page-link"><span data-i18n="hasAccount">Zaten hesabınız var mı?</span> <a href="/login" data-i18n="login">Giriş Yap</a></p>
  <p class="auth-page-link"><a href="/">← Touristlio</a></p>
</div>
<script src="/js/i18n.js?v=__APP_VERSION__"></script>
<script src="/js/bind-actions.js?v=__APP_VERSION__"></script>
<script src="/js/a11y.js?v=__APP_VERSION__"></script>
<script src="/js/skeleton.js?v=__APP_VERSION__"></script>
<script src="/js/auth-client.js?v=__APP_VERSION__"></script>
<script src="/js/analytics.js?v=__APP_VERSION__"></script>
<script src="/js/cookie-banner.js?v=__APP_VERSION__"></script>
<script src="/js/toast.js?v=__APP_VERSION__"></script>
<script src="/js/form-security.js?v=__APP_VERSION__"></script>
<script>
const lang = window.TL_I18N.bootLocale();
window.TL_I18N.apply(lang);
function t(k){ return window.TL_I18N.t(lang,k); }
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const errEl = document.getElementById('authFormError');
function showErr(msg){ window.TL_AUTH.show(errEl, msg); }
function hideErr(){ window.TL_AUTH.hide(errEl); }
async function doReg(){
  hideErr();
  const name = regName.value.trim();
  const email = regEmail.value.trim();
  const password = regPass.value;
  if(name.length < 2){ showErr(t('authNameRequired')); return; }
  if(!EMAIL_RE.test(email)){ showErr(t('contactEmailInvalid') || 'Geçerli e-posta girin'); return; }
  if(!password){ showErr(t('authPassRequired')); return; }
  if(!gC.checked){ showErr(t('kvkkRequired')); return; }
  const btn = document.getElementById('regSubmit');
  window.TL_SKELETON?.button(btn, true);
  try {
    const body = await window.TL_FORM_SECURITY.attach({
      name, email, password, kvkkAccepted: true,
    }, 'register');
    const res = await fetch('/api/auth/register', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(window.TL_AUTH.parseError(data, t('requestFailed')));
    const result = data.data || data;
    localStorage.setItem('tl_user', JSON.stringify(result.user));
    const verifyMsg = result.emailVerificationSent !== false
      ? t('registerSuccessVerify')
      : t('registerSuccess');
    window.TL_TOAST?.success(verifyMsg);
    setTimeout(() => { location.href = '/profile'; }, 2000);
  } catch(e){ showErr(e.message || t('requestFailed')); }
  finally { window.TL_SKELETON?.button(btn, false); }
}
</script>
</body>
</html>
