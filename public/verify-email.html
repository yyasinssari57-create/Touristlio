<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>E-posta Doğrulama — Touristlio</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="stylesheet" href="/css/inline-overrides.css"/>
</head>
<body class="auth-page">
<nav class="tl-nav"><div class="nav-inner">
  <a href="/" class="brand"><span class="brand-text">Tourist<span class="brand-accent">lio</span></span></a>
  <a href="/" class="nav-brand-center" aria-label="Touristlio"><img src="/images/logo-round.png?v=5" alt="" class="brand-mark" width="46" height="46"/></a>
</div></nav>
<div class="auth-page-box">
  <h1 data-i18n="verifyEmailTitle">E-posta doğrulama</h1>
  <p id="verifyStatus" class="auth-page-sub" data-i18n="verifyEmailWorking">E-posta adresiniz doğrulanıyor…</p>
  <p class="auth-page-link"><a href="/login" data-i18n="login">Giriş Yap</a></p>
  <p class="auth-page-link"><a href="/">← Touristlio</a></p>
</div>
<script src="/js/i18n.js"></script>
<script>
const lang = localStorage.getItem('tl_lang') || 'tr';
window.TL_I18N.apply(lang);
function t(k){ return window.TL_I18N.t(lang,k); }
async function verify(){
  const token = new URLSearchParams(location.search).get('token');
  const status = document.getElementById('verifyStatus');
  if(!token){
    status.textContent = t('verifyEmailFail');
    return;
  }
  try {
    const res = await fetch('/api/auth/verify-email', {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error);
    status.textContent = t('verifyEmailSuccess');
  } catch {
    status.textContent = t('verifyEmailFail');
  }
}
verify();
</script>
</body>
</html>
