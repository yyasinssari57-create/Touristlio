<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gezi Planlayıcı — Touristlio</title>
<meta name="description" content="Touristlio Gezi Planlayıcı Pro — günlük rota, sürükle-bırak, harita ve paylaşım."/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="trip-planner-page">
<nav class="tl-nav">
  <div class="nav-inner">
    <a href="/" class="brand" aria-label="Touristlio ana sayfa"><h1 class="brand-name">Tourist<span class="brand-accent">lio</span></h1></a>
    <a href="/" class="nav-brand-center" aria-label="Touristlio"><img src="/images/logo-round.png?v=5" alt="" class="brand-mark" width="46" height="46"/></a>
    <div class="nav-r"><a href="/" class="btn nav-btn-ghost" data-i18n="explore">Keşfet</a></div>
  </div>
</nav>

<main class="tp-wrap">
  <h1 data-i18n="tripPlannerTitle">🧳 Gezi Planlayıcı Pro</h1>
  <div class="tp-wiz-dots"><span class="tp-wiz-dot on"></span><span class="tp-wiz-dot"></span><span class="tp-wiz-dot"></span></div>

  <section class="tp-step active" id="tp-step-1">
    <h2 data-i18n="tripStep1">1. Temel Bilgiler</h2>
    <label><span data-i18n="tripName">Plan adı</span><input id="tpName" type="text" data-i18n-placeholder="tripNamePh"/></label>
    <label><span data-i18n="filterCountry">Ülke</span><input id="tpCountry" type="text"/></label>
    <label><span data-i18n="filterCity">Şehir</span><input id="tpCity" type="text" required/></label>
    <label><span data-i18n="tripStart">Başlangıç</span><input id="tpStart" type="date"/></label>
    <label><span data-i18n="tripEnd">Bitiş</span><input id="tpEnd" type="date"/></label>
    <button type="button" class="btn bp" id="tpNext1" data-i18n="tripNext">İleri →</button>
  </section>

  <section class="tp-step" id="tp-step-2">
    <h2 data-i18n="tripStep2">2. Tercihler</h2>
    <label><span data-i18n="tripTravelers">Gezgin sayısı</span><input id="tpTravelers" type="number" min="1" max="20" value="2"/></label>
    <label><span data-i18n="tripType">İlgi alanı</span>
      <select id="tpType"><option value="culture">🏛️ Kültür</option><option value="nature">⛰️ Doğa</option><option value="food">🍽️ Yemek</option></select>
    </label>
    <label><span data-i18n="tripBudget">Bütçe</span>
      <select id="tpBudget"><option value="low" data-i18n="tripBudgetLow">Ekonomik</option><option value="mid" selected data-i18n="tripBudgetMid">Orta</option><option value="high" data-i18n="tripBudgetHigh">Lüks</option></select>
    </label>
    <label><span data-i18n="tripTransport">Ulaşım</span>
      <select id="tpTransport"><option value="walk">🚶 Yürüyüş</option><option value="transit">🚇 Toplu taşıma</option><option value="car">🚗 Araç</option></select>
    </label>
    <div class="tp-actions">
      <button type="button" class="btn bo" id="tpBack2" data-i18n="back">← Geri</button>
      <button type="button" class="btn bp" id="tpNext2" data-i18n="tripGenerate">Rotayı Oluştur</button>
    </div>
  </section>

  <section class="tp-step" id="tp-step-3">
    <h2 data-i18n="tripStep3">3. Günlük Program</h2>
    <div id="tpSchedule"></div>
    <div id="tpMap" class="tp-map" role="region" aria-label="Rota haritası"></div>
    <div class="tp-actions">
      <button type="button" class="btn bo" id="tpBack3" data-i18n="back">← Geri</button>
      <button type="button" class="btn bo" id="tpPrint" data-i18n="tripPrint">🖨️ Yazdır / PDF</button>
      <button type="button" class="btn bp" id="tpSave" data-i18n="tripSave">Kaydet</button>
    </div>
    <p class="tp-share"><span data-i18n="tripShare">Paylaşım:</span> <a id="tpShareLink" href="#" target="_blank" rel="noopener"></a></p>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="/js/i18n.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/trip-planner.js"></script>
<script>
const lang = localStorage.getItem('tl_lang') || 'tr';
window.TL_I18N.apply(lang);
window.TL_TRIP.init(lang);
</script>
</body>
</html>
