<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Şifre Sıfırlama — Touristlio</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="stylesheet" href="/css/inline-overrides.css"/>
</head>
<body class="auth-page">
<nav class="tl-nav"><div class="nav-inner">
  <a href="/" class="brand"><span class="brand-text">Tourist<span class="brand-accent">lio</span></span></a>
  <a href="/" class="nav-brand-center" aria-label="Touristlio"><img src="/images/logo-round.png?v=5" alt="" class="brand-mark" width="46" height="46"/></a>
</div></nav>
<div class="auth-page-box">
  <h1 data-i18n="resetPasswordTitle">Yeni şifre belirle</h1>
  <p class="auth-page-sub" data-i18n="resetPasswordSub">Hesabınız için yeni bir şifre girin.</p>
  <div id="resetForm">
    <input class="ain" id="resetPass" type="password" data-i18n-placeholder="resetPasswordNew" placeholder="Yeni şifre" autocomplete="new-password"/>
    <input class="ain" id="resetPassConfirm" type="password" data-i18n-placeholder="resetPasswordConfirm" placeholder="Yeni şifre (tekrar)" autocomplete="new-password"/>
    <p class="auth-page-sub" style="font-size:.78rem;margin-top:-4px" data-i18n="settingsNote">Şifre en az 8 karakter, bir büyük harf ve bir rakam içermelidir.</p>
    <button class="btn bp" onclick="doReset()" data-i18n="resetPasswordSubmit">Şifreyi güncelle</button>
  </div>
  <p id="resetStatus" class="auth-page-sub" style="display:none"></p>
  <p class="auth-page-link"><a href="/login" data-i18n="login">Giriş Yap</a></p>
  <p class="auth-page-link"><a href="/">← Touristlio</a></p>
</div>
<script src="/js/i18n.js"></script>
<script>
const lang = localStorage.getItem('tl_lang') || 'tr';
window.TL_I18N.apply(lang);
function t(k){ return window.TL_I18N.t(lang,k); }
const token = new URLSearchParams(location.search).get('token');
const resetForm = document.getElementById('resetForm');
const resetStatus = document.getElementById('resetStatus');

function authErrorMessage(data) {
  if (typeof data?.error === 'string' && data.error) return data.error;
  if (Array.isArray(data?.errors) && data.errors[0]?.msg) return data.errors[0].msg;
  return t('requestFailed');
}

function validatePassword(pw) {
  if (pw.length < 8) return t('settingsNote');
  if (!/[A-Z]/.test(pw)) return t('settingsNote');
  if (!/[0-9]/.test(pw)) return t('settingsNote');
  return null;
}

function showError(msg) {
  resetForm.style.display = 'none';
  resetStatus.style.display = '';
  resetStatus.textContent = msg;
}

if (!token) {
  showError(t('resetPasswordNoToken'));
}

async function doReset() {
  if (!token) return;
  const password = resetPass.value;
  const confirm = resetPassConfirm.value;
  if (password !== confirm) {
    alert(t('resetPasswordMismatch'));
    return;
  }
  const pwErr = validatePassword(password);
  if (pwErr) {
    alert(pwErr);
    return;
  }
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(authErrorMessage(data));
    resetForm.style.display = 'none';
    resetStatus.style.display = '';
    resetStatus.textContent = t('resetPasswordSuccess');
    setTimeout(() => { location.href = '/login'; }, 2000);
  } catch (e) {
    alert(e.message || t('resetPasswordFail'));
  }
}
</script>
</body>
</html>
