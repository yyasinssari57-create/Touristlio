<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Şifre Sıfırlama — Touristlio</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="stylesheet" href="/css/inline-overrides.css"/>
</head>
<body class="auth-page">
<nav class="tl-nav"><div class="nav-inner">
  <a href="/" class="brand"><span class="brand-text">Tourist<span class="brand-accent">lio</span></span></a>
  <a href="/" class="nav-brand-center" aria-label="Touristlio"><img src="/images/logo-round.png?v=5" alt="" class="brand-mark" width="46" height="46"/></a>
</div></nav>
<div class="auth-page-box">
  <h1 data-i18n="resetPasswordTitle">Yeni şifre belirle</h1>
  <p id="resetStatus" class="auth-page-sub" data-i18n="resetPasswordSub">Hesabınız için yeni bir şifre girin.</p>
  <div id="resetFormWrap">
    <input class="ain" id="resetPass" type="password" data-i18n-placeholder="resetPasswordNew" placeholder="Yeni şifre"/>
    <input class="ain" id="resetPass2" type="password" data-i18n-placeholder="resetPasswordConfirm" placeholder="Yeni şifre (tekrar)"/>
    <button class="btn bp" id="resetBtn" onclick="doReset()" data-i18n="resetPasswordSubmit">Şifreyi güncelle</button>
  </div>
  <p class="auth-page-link"><a href="/login" data-i18n="login">Giriş Yap</a></p>
  <p class="auth-page-link"><a href="/">← Touristlio</a></p>
</div>
<script src="/js/i18n.js"></script>
<script>
const lang = localStorage.getItem('tl_lang') || 'tr';
window.TL_I18N.apply(lang);
function t(k){ return window.TL_I18N.t(lang,k); }
function authErrorMessage(data) {
  if (typeof data?.error === 'string' && data.error) return data.error;
  if (Array.isArray(data?.errors) && data.errors[0]?.msg) return data.errors[0].msg;
  return t('requestFailed');
}
const token = new URLSearchParams(location.search).get('token');
const status = document.getElementById('resetStatus');
const formWrap = document.getElementById('resetFormWrap');
if (!token) {
  status.textContent = t('resetPasswordNoToken');
  formWrap.style.display = 'none';
}
async function doReset(){
  if (!token) return;
  const password = resetPass.value;
  const password2 = resetPass2.value;
  if (password !== password2) {
    alert(t('resetPasswordMismatch'));
    return;
  }
  const btn = document.getElementById('resetBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/reset-password', {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(authErrorMessage(data));
    formWrap.style.display = 'none';
    status.textContent = t('resetPasswordSuccess');
    setTimeout(() => { location.href = '/login'; }, 1800);
  } catch(e) {
    alert(e.message || t('resetPasswordFail'));
    btn.disabled = false;
  }
}
</script>
</body>
</html>
