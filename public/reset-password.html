<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Şifre Sıfırlama — Touristlio</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__"/>
<link rel="stylesheet" href="/css/inline-overrides.css?v=__APP_VERSION__"/>
</head>
<body class="auth-page">
<a href="#main-content" class="skip-link" data-i18n="skipLink">İçeriğe geç</a>
<nav class="tl-nav"><div class="nav-inner">
  <a href="/" class="brand"><span class="brand-text">Tourist<span class="brand-accent">lio</span></span></a>
  <a href="/" class="nav-brand-center" aria-label="Touristlio"><img src="/images/logo-round.webp?v=6" alt="Touristlio" class="brand-mark" width="46" height="46" loading="lazy" decoding="async" /></a>
</div></nav>
<div class="auth-page-box" id="main-content" tabindex="-1">
  <h1 data-i18n="resetPasswordTitle">Yeni şifre belirle</h1>
  <p class="auth-page-sub" data-i18n="resetPasswordSub">Hesabınız için yeni bir şifre girin.</p>
  <div id="resetForm">
    <label class="sr-only" for="resetPass" data-i18n="resetPasswordNew">Yeni şifre</label>
    <input class="ain" id="resetPass" type="password" data-i18n-placeholder="resetPasswordNew" placeholder="Yeni şifre" autocomplete="new-password"/>
    <label class="sr-only" for="resetPassConfirm" data-i18n="resetPasswordConfirm">Yeni şifre (tekrar)</label>
    <input class="ain" id="resetPassConfirm" type="password" data-i18n-placeholder="resetPasswordConfirm" placeholder="Yeni şifre (tekrar)" autocomplete="new-password"/>
    <p class="auth-page-sub" style="font-size:.78rem;margin-top:-4px" data-i18n="settingsNote">Şifre en az 12 karakter, bir büyük harf ve bir rakam içermelidir.</p>
    <p id="authFormError" class="auth-inline-error" hidden></p>
    <button class="btn bp" id="resetSubmit" type="button" onclick="doReset()" data-i18n="resetPasswordSubmit">Şifreyi güncelle</button>
  </div>
  <p id="resetStatus" class="auth-page-sub" style="display:none"></p>
  <p class="auth-page-link"><a href="/login" data-i18n="login">Giriş Yap</a></p>
  <p class="auth-page-link"><a href="/">← Touristlio</a></p>
</div>
<script src="/js/i18n.js?v=__APP_VERSION__"></script>
<script src="/js/a11y.js?v=__APP_VERSION__"></script>
<script src="/js/skeleton.js?v=__APP_VERSION__"></script>
<script src="/js/auth-client.js?v=__APP_VERSION__"></script>
<script src="/js/analytics.js?v=__APP_VERSION__"></script>
<script src="/js/cookie-banner.js?v=__APP_VERSION__"></script>
<script>
const lang = localStorage.getItem('tl_lang') || 'tr';
window.TL_I18N.apply(lang);
function t(k){ return window.TL_I18N.t(lang,k); }
const token = new URLSearchParams(location.search).get('token');
const resetForm = document.getElementById('resetForm');
const resetStatus = document.getElementById('resetStatus');
const errEl = document.getElementById('authFormError');

function validatePassword(pw) {
  if (pw.length < 12) return t('settingsNote');
  if (!/[A-Z]/.test(pw)) return t('settingsNote');
  if (!/[0-9]/.test(pw)) return t('settingsNote');
  return null;
}

function showFatal(msg) {
  resetForm.style.display = 'none';
  resetStatus.style.display = '';
  resetStatus.textContent = msg;
}

if (!token) {
  showFatal(t('resetPasswordNoToken'));
}

async function doReset() {
  if (!token) return;
  window.TL_AUTH.hide(errEl);
  const password = resetPass.value;
  const confirm = resetPassConfirm.value;
  if (password !== confirm) {
    window.TL_AUTH.show(errEl, t('resetPasswordMismatch'));
    return;
  }
  const pwErr = validatePassword(password);
  if (pwErr) {
    window.TL_AUTH.show(errEl, pwErr);
    return;
  }
  const btn = document.getElementById('resetSubmit');
  window.TL_SKELETON?.button(btn, true);
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(window.TL_AUTH.parseError(data, t('resetPasswordFail')));
    window.TL_AUTH.clearLocalSession();
    resetForm.style.display = 'none';
    resetStatus.style.display = '';
    resetStatus.textContent = t('resetPasswordSuccess');
    setTimeout(() => { location.href = '/login'; }, 2000);
  } catch (e) {
    window.TL_AUTH.show(errEl, e.message || t('resetPasswordFail'));
  } finally {
    window.TL_SKELETON?.button(btn, false);
  }
}
</script>
</body>
</html>
