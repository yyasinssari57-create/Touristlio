<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Touristlio Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/style.css"/>
<style>
body{font-family:Inter,sans-serif;background:var(--l);}
.admin-login{max-width:360px;margin:120px auto;padding:24px;background:#fff;border-radius:16px;box-shadow:var(--sh2);}
.admin-item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;}
.admin-item img{width:80px;height:60px;object-fit:cover;border-radius:8px;}
.admin-actions{display:flex;gap:6px;}
.btn-ok{background:var(--ok);color:#fff;border:none;padding:8px 14px;border-radius:100px;cursor:pointer;font-weight:600;font-size:.75rem;}
.btn-no{background:#ef4444;color:#fff;border:none;padding:8px 14px;border-radius:100px;cursor:pointer;font-weight:600;font-size:.75rem;}
.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.admin-form .ain{margin-bottom:0;}
.admin-form .full{grid-column:1/-1;}
</style>
</head>
<body>
<div id="loginScreen" class="admin-login">
  <img src="/images/logo.png" alt="Touristlio" class="auth-logo-img" onerror="this.onerror=null;this.src='/images/icon.svg'"/>
  <p style="text-align:center;font-weight:700;color:var(--navy);margin-bottom:12px">Admin</p>
  <input class="ain" id="admEmail" type="email" placeholder="E-posta"/>
  <input class="ain" id="admPass" type="password" placeholder="Şifre"/>
  <button class="btn bp" style="width:100%;margin-top:8px" onclick="adminLogin()">Giriş</button>
  <p style="font-size:.7rem;color:var(--t3);margin-top:10px;text-align:center"><a href="/">← Siteye dön</a></p>
</div>

<div id="adminPanel" style="display:none">
  <nav class="tl-nav"><div class="nav-inner">
    <a href="/" class="brand"><img src="/images/logo-round.png?v=1" alt="" class="brand-mark brand-mark-round" width="44" height="44" onerror="this.onerror=null;this.src='/images/icon-white.svg?v=3';this.classList.remove('brand-mark-round');this.classList.add('brand-mark-white');"/><span class="brand-text">Tourist<span class="brand-accent">lio</span> Admin</span></a>
    <div class="nav-r"><span id="admUser" style="font-size:.8rem;color:rgba(255,255,255,.75)"></span>
    <a href="/" class="btn nav-btn-ghost" style="text-decoration:none">Site</a>
    <button class="btn nav-btn-ghost" onclick="adminLogout()">Çıkış</button></div>
  </div></nav>
  <div class="admin-wrap">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px" id="statsRow"></div>

    <h2 style="font-family:var(--fd);color:var(--navy);margin-bottom:12px">Yeni yer ekle</h2>
    <div class="admin-card">
      <div class="admin-form" id="placeForm">
        <input class="ain" id="plName" placeholder="Yer adı *"/>
        <input class="ain" id="plCountry" placeholder="Ülke *"/>
        <input class="ain" id="plCity" placeholder="Şehir *"/>
        <input class="ain" id="plDistrict" placeholder="İlçe / bölge"/>
        <input class="ain full" id="plLocation" placeholder="Konum metni"/>
        <select class="ain" id="plCat">
          <option value="landmark">landmark</option>
          <option value="museum">museum</option>
          <option value="nature">nature</option>
          <option value="beach">beach</option>
          <option value="religious">religious</option>
          <option value="restaurant">restaurant</option>
          <option value="viewpoint">viewpoint</option>
          <option value="adventure">adventure</option>
        </select>
        <input class="ain" id="plAliases" placeholder="Arama alias (virgülle): Istanbul, İstanbul"/>
        <input class="ain full" id="plImage" placeholder="Görsel URL (Unsplash)"/>
        <textarea class="ain full" id="plDesc" placeholder="Kısa açıklama" style="height:60px"></textarea>
      </div>
      <button class="btn bp bsm" onclick="addPlace()">Yeri kaydet</button>
    </div>

    <div id="modSection" style="display:none">
      <h2 style="font-family:var(--fd);color:var(--navy);margin:24px 0 12px">Moderatör ekle</h2>
      <div class="admin-card admin-form">
        <input class="ain" id="modName" placeholder="Ad"/>
        <input class="ain" id="modEmail" placeholder="E-posta"/>
        <input class="ain full" id="modPass" type="password" placeholder="Geçici şifre"/>
        <button class="btn bp bsm full" onclick="addModerator()">Moderatör oluştur</button>
      </div>
    </div>

    <h2 style="font-family:var(--fd);color:var(--navy);margin:24px 0 12px">Bekleyen Tiola'lar</h2>
    <div id="pendingTiolas"></div>
    <h2 style="font-family:var(--fd);color:var(--navy);margin:24px 0 12px">Bekleyen Bloglar</h2>
    <div id="pendingBlogs"></div>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('tl_token');
let currentUser = null;

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Hata');
  return data;
}

async function adminLogin() {
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('admEmail').value,
        password: document.getElementById('admPass').value,
      }),
    });
    if (!['admin', 'moderator'].includes(data.user.role)) {
      alert('Admin veya moderatör yetkisi gerekli');
      return;
    }
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('tl_token', token);
    localStorage.setItem('tl_user', JSON.stringify(data.user));
    showPanel(data.user);
  } catch (e) { alert(e.message); }
}

function adminLogout() {
  token = null;
  currentUser = null;
  localStorage.removeItem('tl_token');
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('adminPanel').style.display = 'none';
}

async function showPanel(user) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminPanel').style.display = 'block';
  document.getElementById('admUser').textContent = user.name + ' (' + user.role + ')';
  document.getElementById('modSection').style.display = user.role === 'admin' ? 'block' : 'none';
  await refresh();
}

async function addPlace() {
  const aliases = document.getElementById('plAliases').value.split(',').map((s) => s.trim()).filter(Boolean);
  try {
    await api('/admin/places', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('plName').value,
        country: document.getElementById('plCountry').value,
        city: document.getElementById('plCity').value,
        district: document.getElementById('plDistrict').value,
        location: document.getElementById('plLocation').value,
        category: document.getElementById('plCat').value,
        imageUrl: document.getElementById('plImage').value,
        description: document.getElementById('plDesc').value,
        searchAliases: aliases,
      }),
    });
    alert('Yer eklendi');
    await refresh();
  } catch (e) { alert(e.message); }
}

async function addModerator() {
  try {
    await api('/admin/moderators', {
      method: 'POST',
      body: JSON.stringify({
        name: document.getElementById('modName').value,
        email: document.getElementById('modEmail').value,
        password: document.getElementById('modPass').value,
      }),
    });
    alert('Moderatör oluşturuldu');
    document.getElementById('modName').value = '';
    document.getElementById('modEmail').value = '';
    document.getElementById('modPass').value = '';
    await refresh();
  } catch (e) { alert(e.message); }
}

async function refresh() {
  const stats = await api('/admin/stats');
  document.getElementById('statsRow').innerHTML = `
    <div class="admin-card"><strong>${stats.places}</strong><br><span style="font-size:.75rem;color:var(--t2)">Yer</span></div>
    <div class="admin-card"><strong>${stats.tiolasPending}</strong><br><span style="font-size:.75rem;color:var(--t2)">Bekleyen Tiola</span></div>
    <div class="admin-card"><strong>${stats.blogsPending}</strong><br><span style="font-size:.75rem;color:var(--t2)">Bekleyen Blog</span></div>
    <div class="admin-card"><strong>${stats.users}</strong><br><span style="font-size:.75rem;color:var(--t2)">Kullanıcı</span></div>`;

  const ti = await api('/admin/pending/tiolas');
  document.getElementById('pendingTiolas').innerHTML = ti.items.length ? ti.items.map((item) => `
    <div class="admin-card admin-item">
      <div style="flex:1">
        ${item.photoUrl ? `<img src="${item.photoUrl}" alt=""/>` : ''}
        <div><strong>${item.userName}</strong> · ${item.placeName}</div>
        ${item.stars ? `<div style="color:var(--star)">${'★'.repeat(item.stars)}</div>` : ''}
        <p style="font-size:.85rem;color:var(--t2);margin-top:6px">${item.text}</p>
        <div style="font-size:.65rem;color:var(--t3)">${item.createdAt}</div>
      </div>
      <div class="admin-actions">
        <button class="btn-ok" onclick="approveTiola(${item.id})">Onayla</button>
        <button class="btn-no" onclick="rejectTiola(${item.id})">Reddet</button>
      </div>
    </div>`).join('') : '<p style="color:var(--t3)">Bekleyen Tiola yok.</p>';

  const bl = await api('/admin/pending/blogs');
  document.getElementById('pendingBlogs').innerHTML = bl.items.length ? bl.items.map((item) => `
    <div class="admin-card admin-item">
      <div style="flex:1"><strong>${item.title}</strong> — ${item.userName}
        <p style="font-size:.85rem;color:var(--t2)">${item.excerpt || ''}</p></div>
      <div class="admin-actions">
        <button class="btn-ok" onclick="approveBlog(${item.id})">Onayla</button>
        <button class="btn-no" onclick="rejectBlog(${item.id})">Reddet</button>
      </div>
    </div>`).join('') : '<p style="color:var(--t3)">Bekleyen blog yok.</p>';
}

async function approveTiola(id) { await api('/admin/tiolas/' + id + '/approve', { method: 'POST' }); refresh(); }
async function rejectTiola(id) { await api('/admin/tiolas/' + id + '/reject', { method: 'POST' }); refresh(); }
async function approveBlog(id) { await api('/admin/blogs/' + id + '/approve', { method: 'POST' }); refresh(); }
async function rejectBlog(id) { await api('/admin/blogs/' + id + '/reject', { method: 'POST' }); refresh(); }

(async () => {
  if (token) {
    try {
      const me = await api('/auth/me');
      if (['admin', 'moderator'].includes(me.user.role)) showPanel(me.user);
    } catch { adminLogout(); }
  }
})();
</script>
</body>
</html>
