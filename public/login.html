<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Giriş — Touristlio</title>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="auth-page">
<nav class="tl-nav"><div class="nav-inner">
  <a href="/" class="brand"><img src="/images/logo-round.png" alt="" class="brand-mark brand-mark-round" width="44" height="44"/><span class="brand-text">Tourist<span class="brand-accent">lio</span></span></a>
</div></nav>
<div class="auth-page-box">
  <h1 data-i18n="login">Giriş Yap</h1>
  <p class="auth-page-sub" data-i18n="authSub">Seyahatini puanla, kaydet ve paylaş</p>
  <input class="ain" id="loginEmail" type="email" data-i18n-placeholder="authEmail" placeholder="E-posta"/>
  <input class="ain" id="loginPass" type="password" data-i18n-placeholder="authPass" placeholder="Şifre"/>
  <button class="btn bp" style="width:100%" onclick="doLogin()" data-i18n="login">Giriş Yap</button>
  <p class="auth-page-link"><a href="#" onclick="forgotPass();return false" data-i18n="forgotPassword">Şifremi unuttum</a></p>
  <p class="auth-page-link"><span data-i18n="noAccount">Hesabınız yok mu?</span> <a href="/register" data-i18n="authTabReg">Kayıt Ol</a></p>
  <p class="auth-page-link"><a href="/">← Touristlio</a></p>
</div>
<script src="/js/i18n.js"></script>
<script>
const lang = localStorage.getItem('tl_lang') || 'tr';
window.TL_I18N.apply(lang);
function t(k){ return window.TL_I18N.t(lang,k); }
async function doLogin(){
  try {
    const res = await fetch('/api/auth/login', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: loginEmail.value, password: loginPass.value }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error);
    localStorage.setItem('tl_token', data.token);
    localStorage.setItem('tl_user', JSON.stringify(data.user));
    location.href = '/profile';
  } catch(e){ alert(e.message); }
}
async function forgotPass(){
  const email = loginEmail.value.trim();
  if(!email){ alert(t('authEmail')); return; }
  const res = await fetch('/api/auth/forgot-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }) });
  const data = await res.json();
  alert(data.message || 'OK');
}
</script>
</body>
</html>
