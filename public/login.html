<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Giriş — Touristlio</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__"/>
<link rel="stylesheet" href="/css/inline-overrides.css?v=__APP_VERSION__"/>
</head>
<body class="auth-page">
<a href="#main-content" class="skip-link" data-i18n="skipLink">İçeriğe geç</a>
<nav class="tl-nav"><div class="nav-inner">
  <a href="/" class="brand"><span class="brand-text">Tourist<span class="brand-accent">lio</span></span></a>
  <a href="/" class="nav-brand-center" aria-label="Touristlio"><img src="/images/logo-round.webp?v=6" alt="Touristlio" class="brand-mark" width="46" height="46" loading="lazy" decoding="async" /></a>
</div></nav>
<div class="auth-page-box" id="main-content" tabindex="-1">
  <h1 data-i18n="login">Giriş Yap</h1>
  <p class="auth-page-sub" data-i18n="authSub">Seyahatini yıldızla, kaydet ve paylaş</p>
  <label class="sr-only" for="loginEmail" data-i18n="authEmail">E-posta</label>
  <input class="ain" id="loginEmail" type="email" data-i18n-placeholder="authEmail" placeholder="E-posta" autocomplete="username"/>
  <label class="sr-only" for="loginPass" data-i18n="authPass">Şifre</label>
  <input class="ain" id="loginPass" type="password" data-i18n-placeholder="authPass" placeholder="Şifre" autocomplete="current-password"/>
  <p id="authFormError" class="auth-inline-error" hidden></p>
  <div class="tl-hp" aria-hidden="true">
    <label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"/></label>
  </div>
  <button class="btn bp" id="loginSubmit" type="button" onclick="doLogin()" data-i18n="login">Giriş Yap</button>
  <p class="auth-page-link"><button type="button" class="link-btn" onclick="forgotPass()" data-i18n="forgotPassword">Şifremi unuttum</button></p>
  <p class="auth-page-link"><span data-i18n="noAccount">Hesabınız yok mu?</span> <a href="/register" data-i18n="authTabReg">Kayıt Ol</a></p>
  <p class="auth-page-link"><a href="/">← Touristlio</a></p>
</div>
<script src="/js/i18n.js?v=__APP_VERSION__"></script>
<script src="/js/a11y.js?v=__APP_VERSION__"></script>
<script src="/js/skeleton.js?v=__APP_VERSION__"></script>
<script src="/js/auth-client.js?v=__APP_VERSION__"></script>
<script src="/js/analytics.js?v=__APP_VERSION__"></script>
<script src="/js/cookie-banner.js?v=__APP_VERSION__"></script>
<script src="/js/form-security.js?v=__APP_VERSION__"></script>
<script>
const lang = localStorage.getItem('tl_lang') || 'tr';
window.TL_I18N.apply(lang);
function t(k){ return window.TL_I18N.t(lang,k); }
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const errEl = document.getElementById('authFormError');
function showErr(msg){ window.TL_AUTH.show(errEl, msg); }
function hideErr(){ window.TL_AUTH.hide(errEl); }
async function doLogin(){
  hideErr();
  const email = loginEmail.value.trim();
  const password = loginPass.value;
  if(!EMAIL_RE.test(email)){ showErr(t('contactEmailInvalid') || 'Geçerli e-posta girin'); return; }
  if(!password){ showErr(t('authPassRequired')); return; }
  const btn = document.getElementById('loginSubmit');
  window.TL_SKELETON?.button(btn, true);
  try {
    const body = await window.TL_FORM_SECURITY.attach({
      email, password,
    }, 'login');
    const res = await fetch('/api/auth/login', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(window.TL_AUTH.parseError(data, t('requestFailed')));
    const result = data.data || data;
    localStorage.setItem('tl_user', JSON.stringify(result.user));
    location.href = '/profile';
  } catch(e){ showErr(e.message || t('requestFailed')); }
  finally { window.TL_SKELETON?.button(btn, false); }
}
async function forgotPass(){
  hideErr();
  const email = loginEmail.value.trim();
  if(!email){ showErr(t('authEmailRequired')); return; }
  if(!EMAIL_RE.test(email)){ showErr(t('contactEmailInvalid') || 'Geçerli e-posta girin'); return; }
  try {
    const body = await window.TL_FORM_SECURITY.attach({ email }, 'forgot');
    const res = await fetch('/api/auth/forgot-password', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(window.TL_AUTH.parseError(data, t('requestFailed')));
    const result = data.data || data;
    showErr('');
    window.TL_AUTH.hide(errEl);
    alert(result.message || t('forgotPasswordSent'));
  } catch(e){ showErr(e.message || t('requestFailed')); }
}
</script>
</body>
</html>
