<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Giriş — Touristlio</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__"/>
<link rel="stylesheet" href="/css/inline-overrides.css?v=__APP_VERSION__"/>
</head>
<body class="auth-page">
<nav class="tl-nav"><div class="nav-inner">
  <a href="/" class="brand"><span class="brand-text">Tourist<span class="brand-accent">lio</span></span></a>
  <a href="/" class="nav-brand-center" aria-label="Touristlio"><img src="/images/logo-round.png?v=5" alt="" class="brand-mark" width="46" height="46"/></a>
</div></nav>
<div class="auth-page-box">
  <h1 data-i18n="login">Giriş Yap</h1>
  <p class="auth-page-sub" data-i18n="authSub">Seyahatini yıldızla, kaydet ve paylaş</p>
  <input class="ain" id="loginEmail" type="email" data-i18n-placeholder="authEmail" placeholder="E-posta"/>
  <input class="ain" id="loginPass" type="password" data-i18n-placeholder="authPass" placeholder="Şifre"/>
  <button class="btn bp" onclick="doLogin()" data-i18n="login">Giriş Yap</button>
  <p class="auth-page-link"><a href="#" onclick="forgotPass();return false" data-i18n="forgotPassword">Şifremi unuttum</a></p>
  <p class="auth-page-link"><span data-i18n="noAccount">Hesabınız yok mu?</span> <a href="/register" data-i18n="authTabReg">Kayıt Ol</a></p>
  <p class="auth-page-link"><a href="/">← Touristlio</a></p>
</div>
<script src="/js/i18n.js?v=__APP_VERSION__"></script>
<script>
const lang = localStorage.getItem('tl_lang') || 'tr';
window.TL_I18N.apply(lang);
function t(k){ return window.TL_I18N.t(lang,k); }
function authErrorMessage(data) {
  if (typeof data?.error === 'string' && data.error) return data.error;
  if (Array.isArray(data?.errors) && data.errors[0]?.msg) return data.errors[0].msg;
  return t('requestFailed');
}
async function doLogin(){
  try {
    const res = await fetch('/api/auth/login', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: loginEmail.value, password: loginPass.value }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(authErrorMessage(data));
    const payload = data.data || data;
    localStorage.setItem('tl_user', JSON.stringify(payload.user));
    location.href = '/profile';
  } catch(e){ alert(e.message || t('requestFailed')); }
}
async function forgotPass(){
  const email = loginEmail.value.trim();
  if(!email){ alert(t('authEmailRequired')); return; }
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(authErrorMessage(data));
    const payload = data.data || data;
    alert(payload.message || t('forgotPasswordSent'));
  } catch(e){ alert(e.message || t('requestFailed')); }
}
</script>
</body>
</html>
