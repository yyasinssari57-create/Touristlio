<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Arama — Touristlio</title>
<meta name="description" content="Touristlio destinasyon arama — filtreler, sayfalama ve paylaşılabilir URL."/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__"/>
<link rel="stylesheet" href="/css/inline-overrides.css?v=__APP_VERSION__"/>
</head>
<body>
<nav class="tl-nav">
  <div class="nav-inner">
    <div class="nav-spacer" aria-hidden="true"></div>
    <a href="/" class="brand nav-brand-text" aria-label="Touristlio ana sayfa">
      <h1 class="brand-name">Tourist<span class="brand-accent">lio</span></h1>
    </a>
    <a href="/" class="nav-brand-center" aria-label="Touristlio">
      <img src="/images/logo-round.webp?v=6" alt="" class="brand-mark" width="46" height="46" loading="lazy" decoding="async" />
    </a>
    <div class="nav-r">
      <div class="lsw"><div class="lb" onclick="setSearchLang('en',this)">EN</div><div class="lb on" onclick="setSearchLang('tr',this)">TR</div></div>
      <a href="/" class="btn nav-btn-ghost" data-i18n="explore">Keşfet</a>
    </div>
  </div>
</nav>

<main class="search-page">
  <h1 class="search-page-title" data-i18n="searchPageTitle">Destinasyon Ara</h1>
  <form class="search-page-form" id="searchForm" role="search" autocomplete="off">
    <input type="search" id="searchQ" name="q" data-i18n-placeholder="searchPh" placeholder="İstanbul, Paris..." autocomplete="one-time-code" autocapitalize="off" spellcheck="false" aria-label="Arama"/>
    <select id="searchCat" aria-label="Kategori">
      <option value="all" data-i18n="all">Tümü</option>
      <option value="landmark">🏛️ Tarihi</option>
      <option value="museum">🏺 Müze</option>
      <option value="nature">⛰️ Doğa</option>
      <option value="restaurant">🍽️ Restoran</option>
    </select>
    <select id="searchSort" aria-label="Sıralama">
      <option value="popularity" data-i18n="sortPopularity">En Popüler</option>
      <option value="rating" data-i18n="sortTiola">En Yüksek Tiola</option>
      <option value="az" data-i18n="sortAz">A → Z</option>
    </select>
    <button type="submit" class="btn bp" data-i18n="searchBtn">🔍 Keşfet</button>
  </form>
  <p class="search-meta" id="searchMeta" aria-live="polite"></p>
  <div class="pgrid" id="searchGrid"></div>
  <div class="search-pagination">
    <button type="button" class="btn bo" id="searchPrev" disabled data-i18n="searchPrev">← Önceki</button>
    <span id="searchPageInfo"></span>
    <button type="button" class="btn bo" id="searchNext" data-i18n="searchNext">Sonraki →</button>
  </div>
</main>

<script src="/js/i18n.js?v=__APP_VERSION__"></script>
<script src="/js/img.js?v=__APP_VERSION__"></script>
<script src="/js/analytics.js?v=__APP_VERSION__"></script>
<script src="/js/cookie-banner.js?v=__APP_VERSION__"></script>
<script src="/js/toast.js?v=__APP_VERSION__"></script>
<script src="/js/skeleton.js?v=__APP_VERSION__"></script>
<script>
let lang = localStorage.getItem('tl_lang') || 'tr';
let offset = 0;
const LIMIT = 12;
let total = 0;

function t(k) { return window.TL_I18N.t(lang, k); }

function setSearchLang(l, btn) {
  lang = l;
  localStorage.setItem('tl_lang', l);
  document.querySelectorAll('.lb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  window.TL_I18N.apply(l);
  runSearch(false);
}

function paramsFromForm() {
  return {
    q: document.getElementById('searchQ').value.trim(),
    category: document.getElementById('searchCat').value,
    sort: document.getElementById('searchSort').value,
    limit: LIMIT,
    offset,
  };
}

function updateUrl() {
  const p = paramsFromForm();
  const qs = new URLSearchParams();
  if (p.q) qs.set('q', p.q);
  if (p.category !== 'all') qs.set('category', p.category);
  if (p.sort !== 'popularity') qs.set('sort', p.sort);
  if (offset) qs.set('page', String(Math.floor(offset / LIMIT) + 1));
  history.replaceState(null, '', '/search?' + qs.toString());
  const title = p.q ? `${p.q} — Touristlio` : (lang === 'en' ? 'Search — Touristlio' : 'Arama — Touristlio');
  document.title = title;
}

async function runSearch(append) {
  const grid = document.getElementById('searchGrid');
  if (!append) {
    offset = 0;
    grid.innerHTML = window.TL_SKELETON.card(6);
  }
  const p = paramsFromForm();
  const qs = new URLSearchParams(p).toString();
  try {
    const res = await fetch('/api/search?' + qs);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    total = data.total;
    document.getElementById('searchMeta').textContent = `${total} ${t('placesFound')}${p.q ? ': ' + p.q : ''}`;
    const html = data.places.map(pl => `
      <a class="pc" href="/?place=${pl.id}">
        <div class="pc-img">${window.TL_IMG?.tag ? window.TL_IMG.tag(pl.imageUrl, { alt: pl.name, kind: 'card' }) : `<img src="${pl.imageUrl}" alt="${pl.name}" loading="lazy"/>`}</div>
        <div class="pc-body"><div class="pc-loc">📍 ${pl.location}</div><div class="pc-name">${pl.name}</div></div>
      </a>`).join('');
    grid.innerHTML = html || `<div class="no-res">${t('noResults')}<br><a href="/#explore/map" class="btn bo bsm" style="margin-top:12px;display:inline-flex">${t('mapExploreBtn')}</a></div>`;
    const page = Math.floor(offset / LIMIT) + 1;
    const pages = Math.max(1, Math.ceil(total / LIMIT));
    document.getElementById('searchPageInfo').textContent = `${page} / ${pages}`;
    document.getElementById('searchPrev').disabled = offset <= 0;
    document.getElementById('searchNext').disabled = offset + LIMIT >= total;
    updateUrl();
  } catch (e) {
    grid.innerHTML = '';
    window.TL_TOAST.error(e.message);
  }
}

document.getElementById('searchForm').addEventListener('submit', (e) => { e.preventDefault(); runSearch(false); });
document.getElementById('searchPrev').onclick = () => { offset = Math.max(0, offset - LIMIT); runSearch(false); };
document.getElementById('searchNext').onclick = () => { offset += LIMIT; runSearch(false); };

(function init() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('q')) document.getElementById('searchQ').value = qs.get('q');
  if (qs.get('category')) document.getElementById('searchCat').value = qs.get('category');
  if (qs.get('sort')) document.getElementById('searchSort').value = qs.get('sort');
  if (qs.get('page')) offset = (Number(qs.get('page')) - 1) * LIMIT;
  window.TL_I18N.apply(lang);
  runSearch(false);
})();
</script>
</body>
</html>
