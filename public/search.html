<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Arama — Touristlio</title>
<meta name="description" content="Touristlio destinasyon arama — filtreler, sayfalama ve paylaşılabilir URL."/>
<link rel="stylesheet" href="/css/style.css?v=__APP_VERSION__"/>
<link rel="stylesheet" href="/css/inline-overrides.css?v=__APP_VERSION__"/>
</head>
<body>
<a href="#main-content" class="skip-link" data-i18n="skipLink">İçeriğe geç</a>
<nav class="tl-nav">
  <div class="nav-inner">
    <div class="nav-spacer" aria-hidden="true"></div>
    <a href="/" class="brand nav-brand-text" aria-label="Touristlio ana sayfa">
      <span class="brand-name">Tourist<span class="brand-accent">lio</span></span>
    </a>
    <a href="/" class="nav-brand-center" aria-label="Touristlio">
      <img src="/images/logo-round.webp?v=6" alt="Touristlio" class="brand-mark" width="46" height="46" loading="lazy" decoding="async" />
    </a>
    <div class="nav-r">
      <div class="lsw" role="group" data-i18n-aria="langSwitchAria" aria-label="Dil"><button type="button" class="lb" onclick="setSearchLang('en',this)" data-i18n-aria="langEnAria" aria-label="English" aria-pressed="false">EN</button><button type="button" class="lb on" onclick="setSearchLang('tr',this)" data-i18n-aria="langTrAria" aria-label="Türkçe" aria-pressed="true">TR</button></div>
      <a href="/" class="btn nav-btn-ghost" data-i18n="explore">Keşfet</a>
    </div>
  </div>
</nav>

<main class="search-page" id="main-content" tabindex="-1">
  <h1 class="search-page-title" data-i18n="searchPageTitle">Destinasyon Ara</h1>
  <form class="search-page-form" id="searchForm" role="search" autocomplete="off" data-error-boundary="form">
    <label class="sr-only" for="searchQ" data-i18n="searchAria">Destinasyon ara</label>
    <input type="search" id="searchQ" name="q" data-i18n-placeholder="searchPh" placeholder="İstanbul, Paris..." autocomplete="one-time-code" autocapitalize="off" spellcheck="false" data-i18n-aria="searchAria" aria-label="Arama"/>
    <label class="sr-only" for="searchCat" data-i18n="searchCatAria">Kategori</label>
    <select id="searchCat" aria-label="Kategori">
      <option value="all" data-i18n="all">Tümü</option>
      <option value="landmark" data-i18n="catLandmark">🏛️ Tarihi Yerler</option>
      <option value="museum" data-i18n="catMuseum">🏺 Müzeler</option>
      <option value="nature" data-i18n="catNature">⛰️ Doğa</option>
      <option value="restaurant" data-i18n="catRestaurant">🍽️ Restoranlar</option>
    </select>
    <label class="sr-only" for="searchSort" data-i18n="sortAria">Sıralama</label>
    <select id="searchSort" aria-label="Sıralama">
      <option value="popularity" data-i18n="sortPopularity">En Popüler</option>
      <option value="rating" data-i18n="sortTiola">En Yüksek Tiola</option>
      <option value="az" data-i18n="sortAz">A → Z</option>
    </select>
    <button type="submit" class="btn bp" id="searchSubmit" data-i18n="searchBtn">🔍 Keşfet</button>
    <button type="button" class="btn bo" id="searchClear" data-i18n="filterClear">Filtreler Temizle</button>
  </form>
  <p class="search-meta" id="searchMeta" aria-live="polite"></p>
  <div class="pgrid" id="searchGrid" aria-live="polite" aria-busy="false"></div>
  <div class="search-pagination" id="searchPager">
    <button type="button" class="btn bo bsm" id="searchPrev" disabled data-i18n="searchPrev">← Önceki</button>
    <div class="search-page-nums" id="searchPageNums"></div>
    <button type="button" class="btn bo bsm" id="searchNext" data-i18n="searchNext">Sonraki →</button>
  </div>
  <p class="page-info" id="searchPageInfo"></p>
</main>

<script src="/js/i18n.js?v=__APP_VERSION__"></script>
<script src="/js/a11y.js?v=__APP_VERSION__"></script>
<script src="/js/explore-query.js?v=__APP_VERSION__"></script>
<script src="/js/img.js?v=__APP_VERSION__"></script>
<script src="/js/analytics.js?v=__APP_VERSION__"></script>
<script src="/js/cookie-banner.js?v=__APP_VERSION__"></script>
<script src="/js/toast.js?v=__APP_VERSION__"></script>
<script src="/js/skeleton.js?v=__APP_VERSION__"></script>
<script>
let lang = localStorage.getItem('tl_lang') || 'tr';
let page = 1;
const LIMIT = (window.TL_EXPLORE_QUERY && window.TL_EXPLORE_QUERY.DEFAULT_PAGE_LIMIT) || 20;
let total = 0;
let totalPages = 1;

function t(k) { return window.TL_I18N.t(lang, k); }
function geoText(v) { return window.TL_I18N.geoText ? window.TL_I18N.geoText(lang, v) : (v || ''); }

function setSearchLang(l, btn) {
  lang = l;
  localStorage.setItem('tl_lang', l);
  document.querySelectorAll('.lb').forEach(b => {
    b.classList.remove('on');
    b.setAttribute('aria-pressed', 'false');
  });
  btn.classList.add('on');
  btn.setAttribute('aria-pressed', 'true');
  window.TL_I18N.apply(l);
  runSearch(false);
}

function paramsFromForm() {
  return {
    q: document.getElementById('searchQ').value.trim(),
    category: document.getElementById('searchCat').value,
    sort: document.getElementById('searchSort').value,
    limit: LIMIT,
    page,
  };
}

function updateUrl() {
  const p = paramsFromForm();
  const qs = new URLSearchParams();
  if (p.q) qs.set('q', p.q);
  if (p.category !== 'all') qs.set('category', p.category);
  if (p.sort !== 'popularity') qs.set('sort', p.sort);
  if (page > 1) qs.set('page', String(page));
  history.replaceState(null, '', '/search?' + qs.toString());
  const title = p.q ? `${p.q} — Touristlio` : (lang === 'en' ? 'Search — Touristlio' : 'Arama — Touristlio');
  document.title = title;
}

function renderSearchPager() {
  const prev = document.getElementById('searchPrev');
  const next = document.getElementById('searchNext');
  const info = document.getElementById('searchPageInfo');
  const nums = document.getElementById('searchPageNums');
  if (info) info.textContent = t('pageOf').replace('{0}', String(page)).replace('{1}', String(totalPages));
  if (prev) prev.disabled = page <= 1;
  if (next) next.disabled = page >= totalPages;
  if (nums && window.TL_EXPLORE_QUERY?.pageWindow) {
    nums.innerHTML = window.TL_EXPLORE_QUERY.pageWindow(page, totalPages, 2).map((item) => {
      if (item === '…') return '<span class="page-ellipsis" aria-hidden="true">…</span>';
      const on = Number(item) === Number(page) ? ' on' : '';
      const current = on ? ' aria-current="page"' : '';
      return `<button type="button" class="btn bo bsm page-num${on}" data-page="${item}"${current}>${item}</button>`;
    }).join('');
    nums.querySelectorAll('button[data-page]').forEach((btn) => {
      btn.onclick = () => {
        page = Number(btn.dataset.page) || 1;
        runSearch(false);
      };
    });
  }
}

async function runSearch(resetPage) {
  const grid = document.getElementById('searchGrid');
  const submitBtn = document.getElementById('searchSubmit');
  if (resetPage) page = 1;
  if (window.TL_SKELETON?.fillCards) window.TL_SKELETON.fillCards(grid, 6);
  else grid.innerHTML = window.TL_SKELETON ? window.TL_SKELETON.card(6) : '';
  window.TL_SKELETON?.button(submitBtn, true);
  const p = paramsFromForm();
  const qs = new URLSearchParams({
    q: p.q,
    category: p.category,
    sort: p.sort,
    limit: String(LIMIT),
    page: String(page),
  }).toString();
  try {
    const res = await fetch('/api/search?' + qs);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    const payload = data.success === true && data.data != null ? data.data : data;
    total = payload.total ?? 0;
    page = payload.page || page;
    totalPages = payload.totalPages || Math.max(1, Math.ceil(total / LIMIT) || 1);
    document.getElementById('searchMeta').textContent = `${total} ${t('placesFound')}${p.q ? ': ' + p.q : ''}`;
    if (window.TL_SKELETON?.clear) window.TL_SKELETON.clear(grid);
    const html = (payload.places || []).map(pl => `
      <a class="pc" href="/places/${encodeURIComponent(pl.slug || pl.id)}">
        <div class="pc-img">${window.TL_IMG?.tag ? window.TL_IMG.tag(pl.imageUrl, { alt: pl.name, kind: 'card' }) : `<img src="${pl.imageUrl}" alt="${pl.name}" width="400" height="300" loading="lazy"/>`}</div>
        <div class="pc-body"><div class="pc-loc">📍 ${geoText(pl.location)}</div><div class="pc-name">${pl.name}</div></div>
      </a>`).join('');
    grid.innerHTML = html || `<div class="no-res">${t('noResults')}<br><a href="/explore#explore/map" class="btn bo bsm" style="margin-top:12px;display:inline-flex">${t('mapExploreBtn')}</a></div>`;
    renderSearchPager();
    updateUrl();
  } catch (e) {
    if (window.TL_SKELETON?.clear) window.TL_SKELETON.clear(grid);
    grid.innerHTML = '';
    window.TL_TOAST.error(e.message);
  } finally {
    window.TL_SKELETON?.button(submitBtn, false);
  }
}

document.getElementById('searchForm').addEventListener('submit', (e) => { e.preventDefault(); runSearch(true); });
document.getElementById('searchPrev').onclick = () => { if (page > 1) { page -= 1; runSearch(false); } };
document.getElementById('searchNext').onclick = () => { if (page < totalPages) { page += 1; runSearch(false); } };
document.getElementById('searchClear').onclick = () => {
  document.getElementById('searchQ').value = '';
  document.getElementById('searchCat').value = 'all';
  document.getElementById('searchSort').value = 'popularity';
  page = 1;
  runSearch(true);
};

let searchDebounce;
const SEARCH_DEBOUNCE_MS = 300;
['searchQ', 'searchCat', 'searchSort'].forEach((id) => {
  const el = document.getElementById(id);
  if (!el) return;
  const evt = el.tagName === 'SELECT' ? 'change' : 'input';
  el.addEventListener(evt, () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => runSearch(true), SEARCH_DEBOUNCE_MS);
  });
});

(function init() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('q')) document.getElementById('searchQ').value = qs.get('q');
  if (qs.get('category')) document.getElementById('searchCat').value = qs.get('category');
  if (qs.get('sort')) document.getElementById('searchSort').value = qs.get('sort');
  if (qs.get('page')) page = Math.max(Number(qs.get('page')) || 1, 1);
  window.TL_I18N.apply(lang);
  runSearch(false);
})();
</script>
</body>
</html>
