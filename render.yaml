# Touristlio — Render Blueprint
# Dashboard: New > Blueprint > connect repo with this file
# JWT_SECRET otomatik üretilir (generateValue). İsteğe bağlı: ADMIN_PASSWORD, SMTP_*, SITE_URL, CORS_ORIGIN.
#
# Render kart/hesap sorunu veya VPS tercihi: DEPLOY_HETZNER.md + deploy/hetzner/ (Hetzner CX22 ~€5/ay).
# Render rehberi: DEPLOY.md

services:
  - type: web
    name: touristlio
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    # Node 22 LTS — better-sqlite3 prebuilds; avoids gyp compile on old Node 20.3.x
    # Persistent disk — Starter plan and above only.
    # Free plan: no disk; app auto-creates data/ or falls back to /tmp (ephemeral).
    disk:
      name: touristlio-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      # Optional override — default is project data/touristlio.db
      - key: DATABASE_PATH
        sync: false
      - key: NODE_VERSION
        value: "22.16.0"
      - key: npm_config_build_from_source
        value: "false"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: SITEMAP_ON_START
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: STORAGE_PERSISTENT
        value: "true"
      - key: LIVE_DATA_CRON
        value: "true"
      - key: AFFILIATE_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        sync: false
      - key: SITE_URL
        sync: false
      # Emergency: skip in-app apex→www 301 if Cloudflare already redirects
      - key: DISABLE_WWW_REDIRECT
        sync: false
      # Auto-generated on first deploy; override in Dashboard for a stable secret across redeploys
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
